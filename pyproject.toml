[project]
name = "cortexinvest"
version = "0.1.0"
description = ""
authors = [
    {name = "Aleksandr Terekhov",email = "cahdro2155@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn[standard] (>=0.46.0,<0.47.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)",
    "pyjwt (>=2.12.1,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.0.49,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "pydantic[email] (>=2.13.3,<3.0.0)",
    "python-multipart (>=0.0.27,<0.0.28)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.12,<0.16.0)"
]

[tool.poetry.scripts]
lint = "ruff.__main__:main"

[tool.ruff]
line-length = 88
# fix = false   # лучше не включать по умолчанию
exclude = ["migrations", ".venv", ".git"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "TID"]
ignore = [
    "B008",   # запрет на вызов функций в аргументах по умолчанию – иногда нужно
    "SIM115", # слишком агрессивное правило
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false